name: Publish Python 🐍 distribution 📦 to PyPI

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# Avoid duplicate runs when a release/** branch also has an open PR. Never cancel a tag run: that is the
# only ref that can publish, and interrupting it mid-flight is not something to risk for saved CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Run tests 🧪 (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run tests
        run: pytest tests/

      # Validation must survive python -O, which strips bare `assert`. Kept as its own step so a
      # regression here is legible rather than hidden inside the main run.
      - name: Run tests with assertions disabled
        run: python -O -m pytest tests/

  version-check:
    name: Tag matches __version__ 🏷️
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compare tag against __version__
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('torch_l1_snr/__init__.py').read()).group(1))")
          echo "tag=$TAG  __version__=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match __version__ $PKG"
            exit 1
          fi

  build:
    name: Build distribution 📦
    needs: [test, version-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pypa/build
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Store distribution packages
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/torch-l1-snr

    permissions:
      id-token: write

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
